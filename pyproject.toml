[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doloris"
version = "1.0.0"
description = "Doloris (ドロリス) - Desktop Cyber-Companion & Autonomous Task Supervisor for AI Coding Agents (Codex / Claude)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Doloris Project Contributors" }
]
keywords = [
    "doloris",
    "desktop-pet",
    "ai-agent",
    "codex",
    "claude",
    "antigravity",
    "supervisor",
    "self-healing",
    "automation",
    "task-orchestration",
    "byop"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "Pillow>=10.0.0",
]

[project.scripts]
doloris = "afk_supervisor.cli:main"
doloris-app = "doloris_app.main:main"
afk = "afk_supervisor.cli:main"

[project.urls]
Homepage = "https://github.com/planelin/Doloris"
Documentation = "https://github.com/planelin/Doloris#readme"
Repository = "https://github.com/planelin/Doloris"

[tool.setuptools.packages.find]
include = ["afk_supervisor*", "doloris_app*"]
namespaces = false

[tool.setuptools.package-data]
"afk_supervisor.platform" = ["gui_inject.ps1"]
"doloris_app" = ["assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"supervise.py" = ["E402", "F401"]
"test_supervise.py" = ["F401"]
