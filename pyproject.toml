[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doloris"
version = "1.0.0"
description = "Doloris (ドロリス) - Desktop Cyber-Companion & Autonomous Task Supervisor for AI Coding Agents (Codex / Claude)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Doloris Project Contributors" }
]
keywords = [
    "doloris",
    "desktop-pet",
    "ai-agent",
    "codex",
    "claude",
    "antigravity",
    "supervisor",
    "self-healing",
    "automation",
    "task-orchestration",
    "byop"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
doloris = "afk_supervisor.cli:main"
doloris-app = "doloris_app.main:main"
afk = "afk_supervisor.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/doloris"
Documentation = "https://github.com/your-username/doloris#readme"
Repository = "https://github.com/your-username/doloris"
