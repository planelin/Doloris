name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.8 Pillow
      - name: Run static checks
        run: ruff check .
      - name: Run isolated sandbox suite
        run: python -B -X utf8 tests/run_isolated.py
      - name: Run full unit test suite
        run: python -m unittest
